name: wayreveal_places_ui_kit_bridge
description: Android Flutter bridge for hosting Google Places UI Kit in WAYReveal.
version: 0.0.1
repository: https://github.com/WAYReveal-app/wayreveal-places-ui-kit-bridge

environment:
  sdk: ^3.10.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.wayreveal.wayreveal_places_ui_kit_bridge
        pluginClass: WayrevealPlacesUiKitBridgePlugin
